<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Office Status</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="/">
        <span class="brand-icon" aria-hidden="true"><i></i><i></i><i></i></span>
        Office Status
      </a>
      <nav aria-label="Main navigation">
        <a href="#services">Services</a>
        <a href="#requests">Requests</a>
        <a class="button button-small nav-action" href="#new-request">New request</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section class="intro" aria-labelledby="page-title">
      <div>
        <h1 id="page-title">Office status</h1>
        <p>Check shared services and get help from IT.</p>
      </div>
      <span class="demo-label">Sample data</span>
    </section>

    <section id="services" class="service-section" aria-labelledby="service-title">
      <div class="section-heading">
        <div>
          <h2 id="service-title">Service status</h2>
          <p id="service-summary" role="status">Loading service statuses…</p>
        </div>
        <button id="refresh" class="button button-secondary button-small" type="button">
          <span aria-hidden="true">↻</span> Refresh
        </button>
      </div>
      <div id="service-list" class="service-grid"></div>
    </section>

    <div class="support-grid">
      <section id="new-request" class="panel" aria-labelledby="form-title">
        <h2 id="form-title">Report an issue</h2>
        <form id="request-form">
          <label for="name">Name</label>
          <input id="name" name="name" autocomplete="name" required maxlength="80" placeholder="Your name">

          <label for="issue_type">Issue type</label>
          <select id="issue_type" name="issue_type" required>
            <option value="">Select an issue type</option>
            <option>Email</option>
            <option>VPN</option>
            <option>File share</option>
            <option>Other</option>
          </select>

          <label for="description">Description</label>
          <textarea id="description" name="description" required maxlength="1000" rows="4" placeholder="What happened?"></textarea>
          <button class="button" type="submit">Submit request <span aria-hidden="true">→</span></button>
          <p id="form-feedback" class="feedback" role="status"></p>
        </form>
      </section>

      <section id="requests" class="panel requests-panel" aria-labelledby="requests-title">
        <div class="requests-heading">
          <h2 id="requests-title">Support requests</h2>
          <span id="open-count" class="count" hidden></span>
        </div>
        <p id="request-feedback" class="feedback" role="status">Loading requests…</p>
        <ol id="request-list" class="request-list"></ol>
      </section>
    </div>
  </main>

  <template id="service-template">
    <article class="service-card">
      <div class="card-top">
        <span class="service-icon" aria-hidden="true"></span>
        <span class="pill service-status"></span>
      </div>
      <h3></h3>
      <p class="service-description"></p>
      <div class="checked">Last checked <time></time></div>
    </article>
  </template>

  <template id="request-template">
    <li class="request-item">
      <div class="request-top">
        <h3></h3>
        <span class="pill request-status"></span>
      </div>
      <p class="request-meta"></p>
      <p class="request-description"></p>
      <div class="request-bottom"></div>
    </li>
  </template>
</body>
</html>
